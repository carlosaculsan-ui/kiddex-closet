<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Buddy Closet</title></head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
:root{
  --sky:#EAF4FF; --blue:#4E97DC; --blue-2:#77B9F5;
  --mint:#55CC9E; --mint-2:#8BE3C0; --mint-d:#2F9B70;
  --butter:#FFF3CF; --gold:#E2A915; --gold-2:#F2BE3D;
  --ink:#43344F; --ink-2:#7C6E8C; --line:#E4EAF5; --card:#FFFFFF; --bg:#F4F8FF; --lock:#EEF1F8;
  --display:"Mochiy Pop One","M PLUS Rounded 1c",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"M PLUS Rounded 1c",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--body);font-weight:700;font-size:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:10px 18px 10px 12px;box-shadow:0 4px 0 var(--line);font-size:17px}
.back svg{width:22px;height:22px}
.bar h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,3vw,34px);margin:0;letter-spacing:.5px;flex:1;min-width:0}
.chip{display:flex;align-items:center;gap:7px;font-size:15px;background:var(--card);border-radius:999px;padding:8px 14px;box-shadow:0 4px 0 var(--line);white-space:nowrap}
.chip svg{width:20px;height:20px}
.status{color:var(--ink-2);font-size:14px}
.status i{width:10px;height:10px;border-radius:50%;background:var(--gold);display:block}
.status.saved i{background:var(--mint)}
.puff{position:relative;font-family:var(--display);font-size:18px;color:#fff;border-radius:999px;padding:13px 26px;background:linear-gradient(180deg,var(--mint-2),var(--mint));box-shadow:inset 0 -5px 0 var(--mint-d),0 5px 12px -4px var(--mint-d);text-shadow:0 2px 0 var(--mint-d)}
.puff::after{content:"";position:absolute;left:16px;right:45%;top:5px;height:7px;border-radius:7px;background:rgba(255,255,255,.55)}
.puff:active{transform:translateY(2px)}
.puff[disabled]{filter:grayscale(.6) opacity(.6);cursor:default}
.leave{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--butter);border-radius:22px;padding:12px 16px}
.leave p{margin:0;flex:1;min-width:200px}
.chipbtn{background:#fff;border-radius:999px;padding:9px 16px;font-size:15px;box-shadow:0 3px 0 #F2D27A}

.main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:1fr}}

/* stage */
.stage{position:relative;background:linear-gradient(180deg,#CFE6FF 0%,var(--sky) 70%);border-radius:36px;min-height:640px;overflow:hidden;box-shadow:0 6px 0 var(--line);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.stage .floor{position:absolute;left:-10%;right:-10%;bottom:-120px;height:220px;border-radius:50%;background:#fff}
.shadow{position:absolute;left:52%;bottom:66px;width:min(190px,36%);height:26px;translate:-50% 0;border-radius:50%;background:rgba(78,151,220,.18)}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.9}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.c1{left:24%;top:9%;width:110px;height:34px;animation:drift 14s ease-in-out infinite alternate}.c1::before{width:52px;height:52px;left:16px;top:-26px}.c1::after{width:40px;height:40px;left:52px;top:-18px}
.c2{right:6%;top:36%;width:84px;height:26px;animation:drift 11s ease-in-out infinite alternate-reverse}.c2::before{width:40px;height:40px;left:12px;top:-20px}.c2::after{width:30px;height:30px;left:40px;top:-12px}
@keyframes drift{to{transform:translateX(26px)}}

.bubble{position:absolute;right:22px;top:30px;max-width:42%;background:#fff;border-radius:26px;padding:12px 20px;font-family:var(--display);font-size:clamp(16px,2vw,21px);line-height:1.3;box-shadow:0 5px 0 var(--line);z-index:4;transform-origin:20% 100%}
.bubble::after{content:"";position:absolute;left:28px;bottom:-10px;width:18px;height:18px;background:#fff;border-radius:4px;rotate:45deg}
.bubble.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6);opacity:.3}100%{transform:scale(1);opacity:1}}
.ribbon{position:absolute;left:50%;bottom:22px;translate:-50% 0;z-index:4;display:flex;gap:6px;align-items:center;background:var(--ink);color:#fff;border-radius:999px;padding:7px 14px;font-size:14px;animation:pop .35s ease-out}
.ribbon svg{width:16px;height:16px}
.ribbon .bar2{width:56px;height:6px;border-radius:6px;background:rgba(255,255,255,.25);overflow:hidden}
.ribbon .bar2 i{display:block;height:100%;background:#fff;border-radius:6px;animation:drain var(--t,2.6s) linear forwards}
@keyframes drain{from{width:100%}to{width:0}}

.slots{position:absolute;left:18px;top:50%;translate:0 -50%;display:flex;flex-direction:column;gap:16px;z-index:3}
.slot{width:74px;height:74px;border-radius:22px;background:#fff;box-shadow:0 5px 0 var(--line);display:grid;place-items:center;position:relative}
.slot svg{width:54px;height:54px}
.slot .dot{width:42px;height:42px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px var(--line)}
.slot .lbl{position:absolute;left:50%;bottom:-11px;translate:-50% 0;background:var(--ink);color:#fff;font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.slot.empty{background:rgba(255,255,255,.6);box-shadow:none;border:3px dashed #B9D6F2}
.slot.empty .plus{font-family:var(--display);font-size:28px;color:#9DC2E8}
.slot.on{box-shadow:0 5px 0 var(--blue),0 0 0 4px var(--blue-2)}

/* companion */
.rig{position:absolute;left:52%;bottom:74px;width:min(300px,58%);translate:-50% 0;cursor:pointer;z-index:2}
.rig svg{display:block;width:100%;height:auto;overflow:visible}
.rig g{transform-box:view-box}
.rig .floatG{transform-origin:374px 1000px;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-10px) scale(1.012,.99)}}
.rig .leanG,.rig .actG{transform-origin:374px 1000px}
.rig .armIdle{animation:armSway 3.2s ease-in-out infinite}
.rig .armIdle.r{animation-delay:-1.6s}
@keyframes armSway{0%,100%{transform:rotate(0)}50%{transform:rotate(var(--sw,3deg))}}

.fx{position:absolute;inset:0;pointer-events:none;z-index:5}
.spark{position:absolute;width:26px;height:26px;animation:spark .9s ease-out forwards}
.spark.heart{width:30px;height:30px;animation:float-up 1.2s ease-out forwards}
@keyframes spark{0%{transform:translate(0,0) scale(.3) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(160deg);opacity:0}}
@keyframes float-up{0%{transform:translate(0,0) scale(.4);opacity:0}20%{opacity:1}100%{transform:translate(var(--dx),-150px) scale(1.1);opacity:0}}

/* closet panel */
.panel{background:var(--card);border-radius:36px;padding:22px;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;gap:16px;min-width:0}
.buddies{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:24px;padding:8px 8px 8px 16px}
.buddies span.t{font-family:var(--display);font-size:15px;color:var(--ink-2);margin-right:auto}
.buddy{display:flex;align-items:center;gap:8px;border-radius:18px;padding:5px 14px 5px 5px;font-family:var(--display);font-size:16px;color:var(--ink-2);position:relative}
.buddy img{width:46px;height:46px;border-radius:14px;background:#fff;object-fit:contain;object-position:50% 20%}
.buddy[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line),0 0 0 3px var(--blue-2)}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;background:var(--bg);border-radius:22px;padding:6px}
.tab{border-radius:18px;padding:9px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--display);font-size:14px;color:var(--ink-2)}
.tab svg{width:36px;height:36px}
.tab .sw{width:30px;height:30px;border-radius:50%;margin:3px 0;box-shadow:0 0 0 2px #fff}
.tab[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line)}
.ghead{display:flex;align-items:center;gap:10px}
.ghead b{font-family:var(--display);font-weight:400;font-size:18px}
.ghead small{color:var(--ink-2);font-size:14px;margin-right:auto}
.off{background:var(--bg);border-radius:999px;padding:8px 14px;font-size:14px;box-shadow:0 3px 0 var(--line)}
.off[disabled]{opacity:.45;cursor:default;box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:340px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.item{position:relative;border-radius:26px;background:var(--bg);padding:12px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 4px 0 var(--line);transition:transform .15s}
.item:hover{transform:translateY(-2px)}
.item:active{transform:translateY(2px)}
.item .pic{width:100%;aspect-ratio:1.2;border-radius:20px;background:#fff;display:grid;place-items:center;overflow:hidden;position:relative}
.item .pic svg{width:80%;height:80%}
.item .pic .sw2{width:58%;aspect-ratio:1;border-radius:50%;box-shadow:inset 0 -8px 0 rgba(0,0,0,.08),0 0 0 5px #fff,0 0 0 7px var(--line)}
.item b{font-family:var(--display);font-weight:400;font-size:15px;text-align:center;line-height:1.2}
.item small{font-size:13px;color:var(--ink-2)}
.item.on{background:var(--butter);box-shadow:0 4px 0 #F2D27A,0 0 0 4px #F6CF5C}
.item.on small{color:var(--gold)}
.item .ck{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;background:var(--mint);color:#fff;display:none;place-items:center;font-size:16px;box-shadow:0 3px 0 var(--mint-d);z-index:1}
.item.on .ck{display:grid}
.item.locked{background:var(--lock)}
.item.locked .pic{background:#F8F9FD}
.item.locked .pic>svg,.item.locked .pic .sw2{filter:saturate(.35) brightness(1.08);opacity:.6}
.item .lk{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;background:var(--ink);display:none;place-items:center;z-index:1;box-shadow:0 3px 0 #2B2135}
.item .lk svg{width:17px;height:17px}
.item.locked .lk{display:grid}
.item .need{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--ink);background:#fff;border-radius:999px;padding:3px 10px}
.item .need svg{width:15px;height:15px}
.item.peek{background:#E8F3FF;box-shadow:0 4px 0 #BFDDFB,0 0 0 4px var(--blue-2)}
.item.nope{animation:nope .45s ease}
@keyframes nope{20%{transform:translateX(-6px) rotate(-2deg)}40%{transform:translateX(6px) rotate(2deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.hint{font-size:14px;color:var(--ink-2);line-height:1.5;margin:0}
@media (max-width:560px){.bar h1{flex:1 1 calc(100% - 140px);font-size:24px}.stage{min-height:500px}.bubble{max-width:58%;font-size:15px;top:18px;right:14px}.slots{left:10px;gap:14px}.slot{width:58px;height:58px;border-radius:18px}.slot svg{width:42px;height:42px}.slot .dot{width:32px;height:32px}.rig{width:min(230px,58%);left:60%;bottom:60px}.shadow{left:60%;bottom:54px}.buddies span.t{display:none}.buddies{justify-content:center;padding-left:8px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.spark{display:none}}
</style>

<div class="wrap">
  <div class="bar">
    <button class="back" id="backBtn" aria-label="Back to home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>Home</button>
    <h1 id="title">Mochi's closet</h1>
    <span class="chip" title="Sample learner data"><svg viewBox="0 0 24 24"><path id="starPath" d="M12 2.6l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17l-5.6 3 1.1-6.3L2.9 9.3l6.3-.9z" fill="#F2BE3D" stroke="#E2A915" stroke-width="1.4" stroke-linejoin="round"/></svg><span id="starCount"></span></span>
    <span class="chip" title="Sample learner data"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="#77B9F5" stroke="#4E97DC" stroke-width="1.4" stroke-linejoin="round"/></svg><span id="lvl"></span></span>
    <span class="chip status" id="status" role="status"><i></i><span id="statusText">All saved</span></span>
    <button class="puff" id="saveBtn">Save look</button>
  </div>
  <div class="leave" id="leave" hidden><p>Your buddy's new look isn't saved yet. Save it before going home?</p><button class="chipbtn" id="leaveSave">Save and go home</button><button class="chipbtn" id="leaveStay">Keep dressing up</button></div>

  <div class="main">
    <section class="stage" id="stage" aria-label="Buddy preview">
      <div class="cloud c1"></div><div class="cloud c2"></div><div class="floor"></div><div class="shadow" id="shadow"></div>
      <div class="bubble" id="bubble" aria-live="polite">Hi Mika!</div>
      <div class="ribbon" id="ribbon" hidden><svg viewBox="0 0 24 24"><use href="#lockIcon"/></svg>Preview<span class="bar2"><i></i></span></div>
      <div class="slots" id="slots"></div>
      <div class="rig" id="rig" role="button" tabindex="0" aria-label="Tap your buddy"></div>
      <div class="fx" id="fx"></div>
    </section>

    <section class="panel" aria-label="Closet">
      <div class="buddies" id="buddies" role="group" aria-label="Pick your study buddy"></div>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="ghead"><b id="gTitle"></b><small id="gCount"></small><button class="off" id="offBtn">Take off</button></div>
      <div class="grid" id="grid" role="tabpanel"></div>
      <p class="hint">Tap a card to try it on. Locked items give a quick preview. Tap your buddy to say hi!</p>
    </section>
  </div>
</div>
<svg width="0" height="0" style="position:absolute"><defs><g id="lockIcon"><rect x="5" y="10.5" width="14" height="10.5" rx="3" fill="#fff"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="#fff" stroke-width="2.6"/><circle cx="12" cy="15.5" r="1.7" fill="#43344F"/></g></defs></svg>

  /* idle moves */
  look:{d:2400,body:[T(0,"none"),T(.2,"rotate(-1.5deg)"),T(.6,"rotate(1.5deg)"),T(1,"none")],
    head:[T(0,"none"),T(.2,"rotate(-11deg)"),T(.45,"rotate(-11deg)"),T(.6,"rotate(9deg)"),T(.85,"rotate(9deg)"),T(1,"none")]},
  stretch:{d:2400,eyes:[[.25,.75,"closed"]],
    body:[T(0,"none"),T(.35,"translateY(-26px) scale(.97,1.06)"),T(.7,"translateY(-26px) scale(.97,1.06)"),T(.85,"scale(1.04,.96)"),T(1,"none")],
    head:[T(0,"none"),T(.35,"rotate(-5deg)"),T(.7,"rotate(5deg)"),T(1,"none")],
    armL:[T(0,0),T(.35,126),T(.7,120),T(1,0)],armR:[T(0,0),T(.35,126),T(.7,120),T(1,0)]},
  scratch:{d:2100,eyes:[[.2,.8,"closed"]],
    body:[T(0,"none"),T(.2,"rotate(-2deg)"),T(.8,"rotate(-2deg)"),T(1,"none")],
    head:[T(0,"none"),T(.2,"rotate(-9deg)"),T(.8,"rotate(-9deg)"),T(1,"none")],
    armL:[T(0,0),T(.2,118),T(.3,106),T(.4,118),T(.5,106),T(.6,118),T(.7,106),T(.85,40),T(1,0)]},
  hum:{d:2600,eyes:[[.1,.9,"happy"]],
    body:[T(0,"none"),T(.25,"rotate(-3deg) translateY(-8px)"),T(.5,"rotate(3deg)"),T(.75,"rotate(-3deg) translateY(-8px)"),T(1,"none")],
    head:[T(0,"none"),T(.25,"rotate(-9deg)"),T(.5,"rotate(9deg)"),T(.75,"rotate(-9deg)"),T(1,"none")],
    armL:[T(0,0),T(.25,22),T(.5,6),T(.75,22),T(1,0)],armR:[T(0,0),T(.25,6),T(.5,22),T(.75,6),T(1,0)]},
};
const IDLE=[["look"],["stretch","Stretchy!"],["wave","Psst! Try something on!"],["scratch","Hmm, what next?"],["hum","La la la~"],["look"]];

/* ---------- Reusable companion: rendering + motion (knows nothing about the closet) ---------- */
function createCompanion(mount,def,parts,{say,sparkle}){
  const [hx,hy]=def.head,[ax,ay]=def.arm,P0=Object.values(parts)[0];
  const img=(cls,clip)=>`<image class="${cls}" width="748" height="1000" ${clip?`clip-path="url(#${clip})"`:""}/>`;
  const armImg=(k,b)=>`<image class="${k}" x="${b[0]}" y="${b[1]}" width="${b[2]-b[0]}" height="${b[3]-b[1]}"/>`;
  const [ex1,ey1]=def.eyes[0],[ex2,ey2]=def.eyes[1];
  const lidLine=(x,y,up)=>up?`M${x-34} ${y+14} Q${x} ${y-30} ${x+34} ${y+14}`:`M${x-36} ${y+4} Q${x} ${y+34} ${x+36} ${y+4}`;
  mount.innerHTML=`<svg viewBox="-60 -170 868 1180" role="img" aria-label="${def.name}">
    <defs><clipPath id="cpH"><path d="${def.HEAD}"/></clipPath><clipPath id="cpB"><path d="${def.BODY}"/></clipPath></defs>
    <g class="floatG"><g class="leanG"><g class="actG">
      <ellipse class="seam" cx="${def.seam[0]}" cy="${def.seam[1]}" rx="${def.seam[2]}" ry="${def.seam[3]}"/>
      ${img("body","cpB")}
      <g data-slot="clothes" transform="${def.fit.clothes}"></g>
      <g data-slot="neck" transform="${def.fit.neck}"></g>
      <g class="headLook" style="transform-origin:${hx}px ${hy}px"><g class="headAct" style="transform-origin:${hx}px ${hy}px">
        ${img("body","cpH")}
        <g class="lids" style="display:none">${P0.lids.map(([,b])=>armImg("lid",b)).join("")}<path class="lidLine" fill="none" stroke="${INK}" stroke-width="10" stroke-linecap="round"/></g>
        <g data-slot="eyes" transform="${def.fit.eyes}"></g><g data-slot="hat" transform="${def.fit.hat}"></g>
      </g></g>
      ${["L","R"].map(s=>{const px=s==="L"?ax:748-ax;return `<g class="armAct${s}" style="transform-origin:${px}px ${ay}px"><g class="armIdle ${s==="R"?"r":""}" style="transform-origin:${px}px ${ay}px;--sw:${s==="L"?3:-3}deg">${armImg("arm"+s,P0["arm"+s][1])}<g data-sleeve="${s}" transform="${def.fit.clothes}"></g></g></g>`}).join("")}
    </g></g></g>
    <g class="fallback" style="display:none"><ellipse cx="374" cy="560" rx="300" ry="420" fill="#F5D5A8" stroke="${INK}" stroke-width="10"/><text x="374" y="580" text-anchor="middle" font-size="80" font-family="sans-serif" fill="${INK}">${def.name}</text></g>
  </svg>`;
  const svg=mount.querySelector("svg"),$q=s=>svg.querySelector(s);
  const G={body:$q(".actG"),head:$q(".headAct"),armL:$q(".armActL"),armR:$q(".armActR")};
  const lids=$q(".lids"),lidPath=$q(".lidLine"),headLook=$q(".headLook"),leanG=$q(".leanG");
  svg.querySelectorAll("image").forEach(i=>i.addEventListener("error",()=>{$q(".floatG").style.display="none";$q(".fallback").style.display=""}));
  const reduce=matchMedia("(prefers-reduced-motion: reduce)");
  let anims=[],eyeTimers=[],busy=0,eyeLock=null,alive=true;

  function setColor(id){
    const p=parts[id]||P0;
    svg.querySelectorAll("image.body").forEach(i=>i.setAttribute("href",p.body));
    ["L","R"].forEach(s=>{const i=$q(".arm"+s);i.setAttribute("href",p["arm"+s][0])});
    svg.querySelectorAll("image.lid").forEach((i,k)=>i.setAttribute("href",p.lids[k][0]));
    $q(".seam").setAttribute("fill",def.seamFill||p.swatch);
  }
  function setEyes(mode){ // open | closed | happy
    if(mode==="open"){lids.style.display="none";return}
    lidPath.setAttribute("d",lidLine(ex1,ey1,mode==="happy")+lidLine(ex2,ey2,mode==="happy"));lids.style.display="";
  }
  function blink(){ if(!alive)return;
    if(!reduce.matches&&!eyeLock){setEyes("closed");setTimeout(()=>{if(!eyeLock)setEyes("open")},120);
      if(Math.random()<.25)setTimeout(()=>{if(!eyeLock){setEyes("closed");setTimeout(()=>{if(!eyeLock)setEyes("open")},110)}},260)}
    setTimeout(blink,2200+Math.random()*3000) }
  setTimeout(blink,1500);

  const armKF=(list,s)=>list.map(([o,a])=>({offset:o,transform:`rotate(${s==="L"?a:-a}deg)`}));
  const kf=list=>list.map(([o,t])=>({offset:o,transform:t}));
  function play(name,text){
    if(text)say(text);
    const m=MOVES[name]; if(!m)return;
    lastAction=Date.now();
    if(name==="celebrate"||name==="happy"||name==="proud"||name==="shake"||name==="greet")sparkle(name==="celebrate"?20:10);
    if(name==="want")sparkle(6,"heart");
    if(name==="poke")sparkle(6);
    if(reduce.matches)return;
    // start each track from wherever it is now, so moves blend instead of snapping
    const tracks={body:m.body,head:m.head,armL:m.armL&&armKF(m.armL,"L"),armR:m.armR&&armKF(m.armR,"R")};
    const next=[];
    for(const k in G){
      let frames=tracks[k]?(k.startsWith("arm")?tracks[k]:kf(tracks[k])):[{offset:0,transform:"none"},{offset:1,transform:"none"}];
      const now=getComputedStyle(G[k]).transform; frames=frames.slice(); frames[0]={offset:0,transform:now==="none"?frames[0].transform:now};
      next.push(G[k].animate(frames,{duration:m.d,easing:"cubic-bezier(.45,.05,.35,1)"}));
    }
    anims.forEach(a=>a.cancel()); anims=next;
    eyeTimers.forEach(clearTimeout); eyeTimers=[]; eyeLock=null; setEyes("open");
    (m.eyes||[]).forEach(([a,b,mode])=>{eyeTimers.push(setTimeout(()=>{eyeLock=mode;setEyes(mode)},a*m.d),setTimeout(()=>{eyeLock=null;setEyes("open")},b*m.d))});
    busy=Date.now()+m.d;
  }
  // idle life: after a quiet spell, do something small on their own
  let lastAction=Date.now(),idleWait=6500,lastIdle=-1;
  const idleTimer=setInterval(()=>{ if(reduce.matches||document.hidden||Date.now()<busy)return;
    if(Date.now()-lastAction>idleWait){let i;do{i=Math.floor(Math.random()*IDLE.length)}while(i===lastIdle);lastIdle=i;
      const [mv,line]=IDLE[i];play(mv,Math.random()<.5?line:null);idleWait=7000+Math.random()*5000}},900);
  // look toward the pointer (head + gentle lean), smoothed
  let tx=0,cx=0,lastMove=0,raf;
  const onMove=e=>{const r=mount.getBoundingClientRect();const dx=(e.clientX-(r.left+r.width/2))/Math.max(300,innerWidth*.5);tx=Math.max(-1,Math.min(1,dx));lastMove=Date.now()};
  addEventListener("pointermove",onMove,{passive:true});addEventListener("pointerdown",onMove,{passive:true});
  (function tick(){ if(!alive)return; if(!reduce.matches){const goal=Date.now()-lastMove<2500?tx:0;cx+=(goal-cx)*.08;
      headLook.style.transform=`rotate(${(cx*9).toFixed(2)}deg)`;leanG.style.transform=`rotate(${(cx*2.2).toFixed(2)}deg)`}
    raf=requestAnimationFrame(tick)})();

  return{setColor,play,
    setWearing(w){
      SLOTS.forEach(s=>{const it=w[s]&&findItem(s,w[s]);$q(`[data-slot="${s}"]`).innerHTML=it?it.svg:""});
      const c=w.clothes&&findItem("clothes",w.clothes);
      $q('[data-sleeve="L"]').innerHTML=c?sleeveSvg(c):"";$q('[data-sleeve="R"]').innerHTML=c?sleeveSvg(c,1):"";
    },
    destroy(){alive=false;clearInterval(idleTimer);cancelAnimationFrame(raf);removeEventListener("pointermove",onMove);removeEventListener("pointerdown",onMove);anims.forEach(a=>a.cancel())}
  };
}

/* ---------- Page: closet state (separate from motion) ---------- */
const blank=id=>({color:COMPANIONS[id].own,hat:null,eyes:null,clothes:null,neck:null});
const snapshot=()=>JSON.stringify({active:state.active,looks:state.looks});
const state={active:"mochi",looks:{mochi:blank("mochi"),kai:blank("kai")},tab:"hat",preview:null};
let savedSnap=snapshot();
const $=id=>document.getElementById(id);
const bubble=$("bubble"),fx=$("fx");
const cur=()=>COMPANIONS[state.active], look=()=>state.looks[state.active];
const partsOf=id=>PARTS[COMPANIONS[id].kind];
function say(t){bubble.innerHTML=t;bubble.classList.remove("pop");void bubble.offsetWidth;bubble.classList.add("pop")}
function sparkle(n,type){ if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const r=$("rig").getBoundingClientRect(),s=$("stage").getBoundingClientRect();
  const cx=r.left-s.left+r.width/2,cy=r.top-s.top+r.height*.35,cols=["#F2BE3D","#8CC8FF","#C3B3FF","#6FD6AE","#FF9DB0"];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,d=110+Math.random()*120,el=document.createElementNS("http://www.w3.org/2000/svg","svg");
    el.setAttribute("viewBox","-12 -12 24 24");el.setAttribute("class","spark"+(type?" "+type:""));
    el.innerHTML=type==="heart"?`<path d="M0 9C-14 0-11-11 0-5C11-11 14 0 0 9z" fill="#FF8FA8"/>`:`<path d="M0-12C1.5-3 3-1.5 12 0C3 1.5 1.5 3 0 12C-1.5 3-3 1.5-12 0C-3-1.5-1.5-3 0-12z" fill="${cols[i%5]}"/>`;
    el.style.left=(type?cx+90+Math.random()*60:cx)-13+"px";el.style.top=cy-13+"px";el.style.animationDelay=(type?i*90:0)+"ms";
    el.style.setProperty("--dx",(type?(Math.random()-.5)*60:Math.cos(a)*d)+"px");el.style.setProperty("--dy",Math.sin(a)*d+"px");
    fx.appendChild(el);setTimeout(()=>el.remove(),1600)} }

let buddy=null;
function mountBuddy(){
  if(buddy)buddy.destroy();
  buddy=createCompanion($("rig"),cur(),partsOf(state.active),{say,sparkle});
}
function shown(){ // what the buddy wears right now (includes a locked preview)
  const w={...look()}; if(state.preview)w[state.preview.slot]=state.preview.id; return w;
}

function renderBuddies(){
  $("buddies").innerHTML=`<span class="t">Study buddy</span>`+Object.entries(COMPANIONS).map(([id,c])=>
    `<button class="buddy" data-buddy="${id}" aria-pressed="${state.active===id}"><img src="${PARTS[c.kind]._head}" alt="">${c.name}</button>`).join("");
}
function renderSlots(){
  const c=cur(),w=shown(),p=partsOf(state.active)[w.color];
  const colorSlot=`<button class="slot ${state.tab==="color"?"on":""}" data-tab="color" aria-label="${c.colorLabel}"><span class="dot" style="background:${p.swatch}"></span><span class="lbl">${c.colorLabel}</span></button>`;
  $("slots").innerHTML=colorSlot+SLOTS.map(s=>{const it=w[s]&&findItem(s,w[s]);
    return `<button class="slot ${it?"":"empty"} ${state.tab===s?"on":""}" data-tab="${s}" aria-label="${LABEL[s]}: ${it?it.name:"nothing"}">${it?icon(it):'<span class="plus">+</span>'}<span class="lbl">${LABEL[s]}</span></button>`}).join("");
}
function renderTabs(){
  const c=cur(),P=partsOf(state.active),g=c.colors.map(([id],i)=>`${P[id].swatch} ${i*100/6}% ${(i+1)*100/6}%`).join(",");
  $("tabs").innerHTML=["color",...SLOTS].map(s=>`<button class="tab" role="tab" id="tab-${s}" aria-selected="${state.tab===s}" data-tab="${s}">${s==="color"?`<span class="sw" style="background:conic-gradient(${g})"></span>`:icon(ITEMS[s][0])}${s==="color"?c.colorLabel:LABEL[s]}</button>`).join("");
}
const lockSvg=`<svg viewBox="0 0 24 24"><use href="#lockIcon"/></svg>`;
const starSvg=`<svg viewBox="0 0 24 24"><use href="#starPath"/></svg>`;
function card({key,on,pic,name,sub,lock}){
  const locked=isLocked(lock),peek=state.preview&&state.preview.id===key&&state.preview.slot===(state.tab==="color"?"color":state.tab);
  return `<button class="item ${on?"on":""} ${locked?"locked":""} ${peek?"peek":""}" data-key="${key}" aria-pressed="${on}" ${locked?`aria-label="${name}, locked. ${lock.stars?`Needs ${lock.stars} stars`:`Needs level ${lock.level}`}"`:""}>
    <span class="ck">✓</span><span class="lk">${lockSvg}</span><span class="pic">${pic}</span><b>${name}</b>
    ${locked?`<span class="need">${lock.stars?starSvg:""}${needText(lock)}</span>`:`<small>${on?"Wearing":sub}</small>`}</button>`;
}
function renderGrid(){
  const s=state.tab,c=cur(),w=look(); $("grid").setAttribute("aria-labelledby","tab-"+s);
  let list;
  if(s==="color"){
    const P=partsOf(state.active);
    list=c.colors.map(([id,name,lock])=>({key:id,on:w.color===id,pic:`<span class="sw2" style="background:${P[id].swatch}"></span>`,name,sub:id===c.own?`${c.name}'s own`:"Try it on",lock}));
    $("gTitle").textContent=c.colorLabel+" color"; $("offBtn").hidden=true;
  }else{
    list=ITEMS[s].map(it=>({key:it.id,on:w[s]===it.id,pic:icon(it),name:it.name,sub:"Try it on",lock:it.lock}));
    $("gTitle").textContent=LABEL[s]; $("offBtn").hidden=false; $("offBtn").disabled=!w[s];
  }
  const open=list.filter(x=>!isLocked(x.lock)).length;
  $("gCount").textContent=`${open} of ${list.length} unlocked`;
  $("grid").innerHTML=list.map(card).join("");
}
function renderStatus(){const ok=snapshot()===savedSnap;$("status").classList.toggle("saved",ok);$("statusText").textContent=ok?"All saved":"Not saved yet";$("saveBtn").disabled=ok}
function render(){
  const w=shown(); buddy.setWearing(w); buddy.setColor(w.color);
  $("title").textContent=`${cur().name}'s closet`;
  $("starCount").textContent=LEARNER.stars; $("lvl").textContent="Level "+LEARNER.level;
  renderBuddies();renderSlots();renderTabs();renderGrid();renderStatus();
}

/* ---------- Locked preview ---------- */
let previewTimer=null;
function endPreview(quiet){ if(!state.preview)return; clearTimeout(previewTimer); state.preview=null; $("ribbon").hidden=true; render();
  if(!quiet)buddy.play("aww","Aww. Keep learning and it's mine!") }
function startPreview(slot,id,name,lock,btn){
  clearTimeout(previewTimer); state.preview={slot,id}; render();
  const r=$("ribbon"); r.hidden=true; void r.offsetWidth; r.hidden=false;
  buddy.play("want",`Ooh, ${name}! ${unlockSay(lock)}`);
  const b=$("grid").querySelector(`[data-key="${id}"]`); if(b){b.classList.add("nope");}
  previewTimer=setTimeout(()=>endPreview(),2600);
}

/* buddy reacts on their own to every change */
$("grid").addEventListener("click",e=>{const b=e.target.closest("[data-key]");if(!b)return;
  const s=state.tab,key=b.dataset.key,c=cur(),w=look();
  if(s==="color"){const [,name,lock]=c.colors.find(x=>x[0]===key);
    if(isLocked(lock))return startPreview("color",key,name+" "+c.colorLabel.toLowerCase(),lock,b);
    endPreview(true); if(w.color===key)return; w.color=key; render();
    buddy.play("shake",key===c.own?c.ownSay:c.colorSay(name)); return}
  const it=findItem(s,key);
  if(isLocked(it.lock))return startPreview(s,key,"a "+it.name.toLowerCase(),it.lock,b);
  endPreview(true);
  if(w[s]===key){w[s]=null;render();buddy.play("curious","Hmm, I like it plain too.");return}
  w[s]=key; render(); buddy.play(it.react,it.say);
});
$("offBtn").addEventListener("click",()=>{const s=state.tab;if(!look()[s])return;endPreview(true);look()[s]=null;render();buddy.play("curious","Hmm, I like it plain too.")});
const switchTab=t=>{state.tab=t;render()};
$("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b)switchTab(b.dataset.tab)});
$("tabs").addEventListener("keydown",e=>{const k=["color",...SLOTS],i=k.indexOf(state.tab);
  if(e.key==="ArrowRight"||e.key==="ArrowLeft"){switchTab(k[(i+(e.key==="ArrowRight"?1:k.length-1))%k.length]);$("tab-"+state.tab).focus()}});
$("slots").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b)switchTab(b.dataset.tab)});

/* switch buddy: current one hops away, new one drops in and waves */
let switching=false;
$("buddies").addEventListener("click",async e=>{const b=e.target.closest("[data-buddy]");if(!b||switching||b.dataset.buddy===state.active)return;
  switching=true; endPreview(true);
  const rig=$("rig"),still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!still) await rig.animate([{transform:"none",opacity:1},{transform:"translateY(-60px) scale(.9)",opacity:1,offset:.4},{transform:"translateY(40px) scale(.2)",opacity:0}],{duration:380,easing:"ease-in"}).finished;
  state.active=b.dataset.buddy; mountBuddy(); render();
  if(!still){ rig.animate([{transform:"translateY(-520px)"},{transform:"translateY(0)"}],{duration:430,easing:"cubic-bezier(.5,0,.9,.6)"});
    $("shadow").animate([{transform:"scale(.3)",opacity:.2},{transform:"scale(1)",opacity:1}],{duration:430,easing:"ease-in"});
    await new Promise(r=>setTimeout(r,430)); buddy.play("land"); await new Promise(r=>setTimeout(r,380)); }
  buddy.play("greet",`${cur().hello} I'm your study buddy now!`); switching=false;
});

/* tap the buddy */
let pokes=[];
function poke(){ endPreview(true); const t=Date.now(); pokes=pokes.filter(x=>t-x<2500); pokes.push(t);
  if(pokes.length>=4){pokes=[];buddy.play("dizzy","Whoa, I'm dizzy!");return}
  const r=[["poke","Hehe, that tickles!"],["wave",`Hi ${LEARNER.name}!`],["happy","Let's learn something fun!"]][Math.floor(Math.random()*3)];
  buddy.play(r[0],r[1]); }
$("rig").addEventListener("click",poke);
$("rig").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();poke()}});

function save(){savedSnap=snapshot();renderStatus();buddy.play("celebrate",`Yay! I love my new look! Thank you, ${LEARNER.name}!`)}
$("saveBtn").addEventListener("click",()=>{endPreview(true);save()});
$("backBtn").addEventListener("click",()=>{ if(snapshot()!==savedSnap){$("leave").hidden=false;$("leaveSave").focus()} else buddy.play("wave","Off to Home! See you there!") });
$("leaveStay").addEventListener("click",()=>{$("leave").hidden=true});
$("leaveSave").addEventListener("click",()=>{$("leave").hidden=true;save()});

mountBuddy(); render();
setTimeout(()=>buddy.play("greet",`${cur().hello} Let's pick something to wear!`),500);
</script>

</body></html>
